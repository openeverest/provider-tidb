# Provider identity and component definitions.
# Edit this file to add or remove components.
# Run `make generate` after making changes.

components:
    pd:
        type: pd
        parametersSchema: PdParameters
    tidb:
        type: tidb
        parametersSchema: TidbParameters
    tikv:
        type: tikv
        parametersSchema: TikvParameters
    tiflash:
        type: tiflash
        parametersSchema: TiflashParameters
    tiproxy:
        type: tiproxy
        parametersSchema: TiproxyParameters
name: tidb

# Component types: the kind of the software each type runs, published as
# Provider.spec.componentTypes.<type>.kind and matched by monitoring classes:
# TiDB and TiKV by their own names, the components that exist only inside a
# TiDB cluster under tidb. Version catalogs stay in versions.yaml.
componentTypes:
    pd:
        kind: tidb.pd
    tikv:
        kind: tikv
    tidb:
        kind: tidb
    tiflash:
        kind: tidb.tiflash
    tiproxy:
        kind: tidb.tiproxy
