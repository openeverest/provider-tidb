# Component type version catalog.
# The TiDB component types (pd, tikv, tidb, tiflash) track the same TiDB release;
# tiproxy has its own version line. The image tag equals the version. Name the
# default version per type via `defaultVersion`.
#
# The top-level `versions:` bundles are what a user selects via
# Instance.spec.version; the runtime resolves a bundle into per-component
# versions before Sync runs.

componentTypes:
    pd:
        defaultVersion: v8.5.2
        versions:
            - version: v8.5.2
              image: pingcap/pd:v8.5.2
            - version: v7.5.5
              image: pingcap/pd:v7.5.5
    tikv:
        defaultVersion: v8.5.2
        versions:
            - version: v8.5.2
              image: pingcap/tikv:v8.5.2
            - version: v7.5.5
              image: pingcap/tikv:v7.5.5
    tidb:
        defaultVersion: v8.5.2
        versions:
            - version: v8.5.2
              image: pingcap/tidb:v8.5.2
            - version: v7.5.5
              image: pingcap/tidb:v7.5.5
    tiflash:
        defaultVersion: v8.5.2
        versions:
            - version: v8.5.2
              image: pingcap/tiflash:v8.5.2
            - version: v7.5.5
              image: pingcap/tiflash:v7.5.5
    tiproxy:
        defaultVersion: v1.3.3
        versions:
            - version: v1.3.3
              image: pingcap/tiproxy:v1.3.3
            - version: v1.3.2
              image: pingcap/tiproxy:v1.3.2

defaultVersion: "8.5.2"
versions:
    - name: "8.5.2"
      components:
          pd: v8.5.2
          tikv: v8.5.2
          tidb: v8.5.2
          tiflash: v8.5.2
          tiproxy: v1.3.3
    - name: "7.5.5"
      components:
          pd: v7.5.5
          tikv: v7.5.5
          tidb: v7.5.5
          tiflash: v7.5.5
          tiproxy: v1.3.3
