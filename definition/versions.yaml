# Component type version catalog.
# Each component type (pd, tikv, tidb) tracks the same TiDB release; the image
# tag equals the version. Name the default version per type via `defaultVersion`.
#
# The top-level `versions:` bundles are what a user selects via
# Instance.spec.version; the runtime resolves a bundle into per-component
# versions before Sync runs.

componentTypes:
    pd:
        defaultVersion: v8.5.2
        versions:
            - version: v8.5.2
              image: pingcap/pd:v8.5.2
            - version: v7.5.5
              image: pingcap/pd:v7.5.5
    tikv:
        defaultVersion: v8.5.2
        versions:
            - version: v8.5.2
              image: pingcap/tikv:v8.5.2
            - version: v7.5.5
              image: pingcap/tikv:v7.5.5
    tidb:
        defaultVersion: v8.5.2
        versions:
            - version: v8.5.2
              image: pingcap/tidb:v8.5.2
            - version: v7.5.5
              image: pingcap/tidb:v7.5.5

defaultVersion: "8.5.2"
versions:
    - name: "8.5.2"
      components:
          pd: v8.5.2
          tikv: v8.5.2
          tidb: v8.5.2
    - name: "7.5.5"
      components:
          pd: v7.5.5
          tikv: v7.5.5
          tidb: v7.5.5
