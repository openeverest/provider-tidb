# Cluster topology: the standard distributed TiDB deployment.
# A cluster is composed of three mandatory components, each reconciled into its
# own TiDB Operator v2 group CR:
#   pd   -> PDGroup    (Placement Driver: metadata, TSO, scheduling)
#   tikv -> TiKVGroup  (distributed KV storage engine)
#   tidb -> TiDBGroup  (stateless SQL layer, MySQL protocol)
# plus the optional columnar engine for analytics (HTAP):
#   tiflash -> TiFlashGroup (enabled while it has at least one replica)
# and the optional connection proxy in front of TiDB:
#   tiproxy -> TiProxyGroup (enabled while it has at least one replica)
#
# This file defines both the structural topology (config) and its UI rendering.

config:
  components:
    tidb:
      defaults:
        replicas: 2
      # Stateless SQL layer: no storage. Declared fields are exactly what Sync
      # reads off the component spec.
      supportedFields:
        properties:
          resources: {}
          replicas: {minimum: 1}
          schedulingPolicy: {}
    tikv:
      defaults:
        replicas: 3
      supportedFields:
        required: [storage]
        properties:
          storage: {}
          resources: {}
          replicas: {minimum: 1}
          schedulingPolicy: {}
    pd:
      defaults:
        replicas: 3
      supportedFields:
        required: [storage]
        properties:
          storage: {}
          resources: {}
          replicas: {minimum: 1}
          schedulingPolicy: {}
    tiflash:
      optional: true
      # 0 replicas keeps the component defined but runs no TiFlash nodes.
      supportedFields:
        required: [storage]
        properties:
          storage: {}
          resources: {}
          replicas: {minimum: 0}
          schedulingPolicy: {}
    tiproxy:
      optional: true
      # Stateless like TiDB: no storage. 0 replicas runs no TiProxy nodes and
      # clients connect to TiDB directly.
      supportedFields:
        properties:
          resources: {}
          replicas: {minimum: 0}
          schedulingPolicy: {}

ui:
  sections:
    databaseVersion:
      label: "Database Version"
      description: "Select the TiDB version for this cluster."
      components:
        version:
          uiType: select
          path: spec.version
          fieldParams:
            label: "Database Version"
            optionsPath: spec.versions
            optionsPathConfig:
              labelPath: "name"
              valuePath: "name"
            modes:
              edit:
                disabled: true
              restore:
                disabled: true
          validation:
            required: true
        rootSecret:
          uiType: secret
          path: spec.userSecretRef.name
          fieldParams:
            label: "Root password"
            definition: root
            helperText: "Leave empty to generate the password."
            modes:
              edit:
                readOnly: true
                helperText: "Set when the database is created."
          # A restore brings back the backed-up cluster's root password.
          modes:
            restore:
              uiType: hidden
      componentsOrder:
        - version
        - rootSecret
    tidb:
      label: "SQL Layer (TiDB)"
      description: "Stateless SQL nodes that speak the MySQL protocol."
      components:
        tidbGroup:
          uiType: group
          components:
            replicas:
              path: "spec.components.tidb.replicas"
              uiType: number
              fieldParams:
                label: "Number of TiDB nodes"
                defaultValue: 2
              validation:
                required: true
                min: 1
                int: true
            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.tidb.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 1
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.tidb.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 2
                    step: 0.1
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 0.5
                    required: true
          componentsOrder:
            - replicas
            - resources
    tikv:
      label: "Storage Layer (TiKV)"
      description: "Distributed key-value storage nodes."
      components:
        tikvGroup:
          uiType: group
          components:
            replicas:
              path: "spec.components.tikv.replicas"
              uiType: number
              fieldParams:
                label: "Number of TiKV nodes"
                defaultValue: 3
              validation:
                required: true
                min: 1
                int: true
            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.tikv.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 1
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.tikv.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 2
                    step: 0.1
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 0.5
                    required: true
                disk:
                  path: "spec.components.tikv.storage.size"
                  uiType: number
                  fieldParams:
                    label: "Disk"
                    defaultValue: 25
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: "spec.components.tikv.storage.size >= original.spec.components.tikv.storage.size"
                            message: "Disk size cannot be decreased"
            storageClass:
              uiType: select
              path: spec.components.tikv.storage.storageClass
              fieldParams:
                label: "Storage class"
                modes:
                  edit:
                    disabled: true
                  restore:
                    disabled: true
              dataSource:
                provider: storageClasses
          componentsOrder:
            - replicas
            - resources
            - storageClass
    tiflash:
      label: "Analytics (TiFlash)"
      description: "Optional columnar replicas that serve analytical queries on live data."
      components:
        tiflashGroup:
          uiType: group
          components:
            replicas:
              path: "spec.components.tiflash.replicas"
              uiType: number
              fieldParams:
                label: "Number of TiFlash nodes"
                helperText: "0 runs the cluster without TiFlash"
                defaultValue: 0
              validation:
                min: 0
                int: true
            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.tiflash.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 2
                    step: 1
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.tiflash.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 4
                    step: 0.1
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 0.5
                    required: true
                disk:
                  path: "spec.components.tiflash.storage.size"
                  uiType: number
                  fieldParams:
                    label: "Disk"
                    defaultValue: 25
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
            storageClass:
              uiType: select
              path: spec.components.tiflash.storage.storageClass
              fieldParams:
                label: "Storage class"
                modes:
                  edit:
                    disabled: true
                  restore:
                    disabled: true
              dataSource:
                provider: storageClasses
          componentsOrder:
            - replicas
            - resources
            - storageClass
    tiproxy:
      label: "Connection proxy (TiProxy)"
      description: "Optional proxy in front of TiDB. It balances sessions across the TiDB nodes and keeps client connections open while TiDB nodes are added, removed or restarted. Turning it on or off changes the connection endpoint."
      components:
        tiproxyGroup:
          uiType: group
          components:
            replicas:
              path: "spec.components.tiproxy.replicas"
              uiType: number
              fieldParams:
                label: "Number of TiProxy nodes"
                helperText: "0 runs the cluster without TiProxy; clients connect to TiDB directly"
                defaultValue: 0
              validation:
                min: 0
                int: true
            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.tiproxy.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 1
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.tiproxy.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 1
                    step: 0.1
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 0.5
                    required: true
          componentsOrder:
            - replicas
            - resources
    pd:
      label: "Placement Driver (PD)"
      description: "Metadata, timestamp and scheduling nodes. Use an odd number for quorum."
      components:
        pdGroup:
          uiType: group
          components:
            replicas:
              path: "spec.components.pd.replicas"
              uiType: number
              fieldParams:
                label: "Number of PD nodes"
                defaultValue: 3
              validation:
                required: true
                min: 1
                int: true
                celExpressions:
                  - celExpr: "spec.components.pd.replicas % 2 == 1"
                    message: "The number of PD nodes must be odd"
            resources:
              uiType: group
              groupType: line
              components:
                cpu:
                  path: "spec.components.pd.resources.limits.cpu"
                  uiType: number
                  fieldParams:
                    label: "CPU"
                    defaultValue: 1
                    step: 1
                  validation:
                    min: 0.5
                    required: true
                memory:
                  path: "spec.components.pd.resources.limits.memory"
                  uiType: number
                  fieldParams:
                    label: "Memory"
                    defaultValue: 2
                    step: 0.1
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 0.5
                    required: true
                disk:
                  path: "spec.components.pd.storage.size"
                  uiType: number
                  fieldParams:
                    label: "Disk"
                    defaultValue: 20
                    badge: "Gi"
                    badgeToApi: true
                  validation:
                    min: 1
                    int: true
                    required: true
                    modes:
                      edit:
                        celExpressions:
                          - celExpr: "spec.components.pd.storage.size >= original.spec.components.pd.storage.size"
                            message: "Disk size cannot be decreased"
            storageClass:
              uiType: select
              path: spec.components.pd.storage.storageClass
              fieldParams:
                label: "Storage class"
                modes:
                  edit:
                    disabled: true
                  restore:
                    disabled: true
              dataSource:
                provider: storageClasses
          componentsOrder:
            - replicas
            - resources
            - storageClass
    security:
      label: "Security"
      description: "Encrypt traffic with TLS, and choose who signs the certificates. The certificates come from cert-manager when it is installed, and from the provider otherwise."
      components:
        mode:
          uiType: select
          path: spec.parameters.tls.mode
          fieldParams:
            label: "TLS mode"
            helperText: "Preferred and Required encrypt the traffic between PD, TiKV, TiDB, TiFlash and TiProxy with mutual TLS and let MySQL clients verify TiDB (or TiProxy) with the CA in the connection secret; Required also refuses plaintext clients. Switching between Preferred and Required works anytime; Disabled can only be chosen when the cluster is created."
            defaultValue: "preferTLS"
            options:
              - label: "Disabled"
                value: "disabled"
              - label: "Preferred: clients choose whether to use TLS"
                value: "preferTLS"
              - label: "Required: clients must use TLS"
                value: "requireTLS"
        issuer:
          uiType: group
          groupType: bordered
          label: "Bring your own CA (optional)"
          description: "A cert-manager issuer that signs every certificate instead of a CA created for this cluster. It must put its CA certificate into the certificate secrets (ca.crt), as CA and Vault issuers do. Can only be chosen when the cluster is created."
          components:
            issuerName:
              uiType: text
              path: spec.parameters.tls.issuer.name
              fieldParams:
                label: "cert-manager issuer"
                helperText: "An Issuer in this namespace or a ClusterIssuer. Leave empty for a CA created for this cluster."
                modes:
                  edit:
                    disabled: true
              validation:
                regex:
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$"
                  message: "Must be a valid Kubernetes object name (lowercase letters, digits, '-' and '.')"
                celExpressions:
                  - celExpr: "!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.issuer) || !has(spec.parameters.tls.issuer.name) || spec.parameters.tls.issuer.name == '' || (has(spec.parameters.tls.mode) && spec.parameters.tls.mode != 'disabled')"
                    message: "Turn TLS on to use an issuer"
                  - celExpr: "!has(spec.parameters) || !has(spec.parameters.tls) || !has(spec.parameters.tls.issuer) || !has(spec.parameters.tls.issuer.kind) || spec.parameters.tls.issuer.kind == '' || (has(spec.parameters.tls.issuer.name) && spec.parameters.tls.issuer.name != '')"
                    message: "Name the issuer"
            issuerKind:
              uiType: select
              path: spec.parameters.tls.issuer.kind
              fieldParams:
                label: "Issuer kind"
                helperText: "Issuer when not set"
                options:
                  - label: "Issuer"
                    value: "Issuer"
                  - label: "ClusterIssuer"
                    value: "ClusterIssuer"
                modes:
                  edit:
                    disabled: true
          componentsOrder:
            - issuerName
            - issuerKind
      componentsOrder:
        - mode
        - issuer
    advanced:
      label: "Advanced configuration"
      description: "Per-component configuration overrides."
      components:
        tidbConfig:
          uiType: text
          path: spec.components.tidb.parameters.config
          fieldParams:
            label: "TiDB configuration (TOML)"
            multiline: true
            minRows: 3
            maxRows: 8
        tikvConfig:
          uiType: text
          path: spec.components.tikv.parameters.config
          fieldParams:
            label: "TiKV configuration (TOML)"
            multiline: true
            minRows: 3
            maxRows: 8
        pdConfig:
          uiType: text
          path: spec.components.pd.parameters.config
          fieldParams:
            label: "PD configuration (TOML)"
            multiline: true
            minRows: 3
            maxRows: 8
        tiflashConfig:
          uiType: text
          path: spec.components.tiflash.parameters.config
          fieldParams:
            label: "TiFlash configuration (TOML)"
            multiline: true
            minRows: 3
            maxRows: 8
        tiproxyConfig:
          uiType: text
          path: spec.components.tiproxy.parameters.config
          fieldParams:
            label: "TiProxy configuration (TOML)"
            multiline: true
            minRows: 3
            maxRows: 8
      componentsOrder:
        - tidbConfig
        - tikvConfig
        - pdConfig
        - tiflashConfig
        - tiproxyConfig
  sectionsOrder:
    - databaseVersion
    - tidb
    - tikv
    - tiflash
    - tiproxy
    - pd
    - security
    - advanced
