# Create form of the root Secret, opened from the "Root password" field.
# Paths are keys of the Secret's data.
label: "Root password"
description: "Password of the root user, set when the database is created."
components:
  password:
    uiType: text
    path: password
    fieldParams:
      label: "Root password"
      type: password
    validation:
      required: true
componentsOrder:
  - password
