# Default values for provider-tidb.

# -- Number of replicas for the provider deployment
replicaCount: 1

image:
  # -- Container image repository
  repository: ghcr.io/openeverest/provider-tidb
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion
  tag: ""

# -- Image pull secrets for private registries
imagePullSecrets: []

# -- Override the name of the chart
nameOverride: ""
# -- Override the full name of the chart
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Automount API credentials for the service account
  automountServiceAccountToken: true
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # -- Specifies whether RBAC resources should be created
  create: true

# -- Annotations to add to the deployment pods
podAnnotations: {}

# -- Labels to add to the deployment pods
podLabels: {}

podSecurityContext:
  # -- Run as non-root
  runAsNonRoot: true
  # -- Security context fsGroup
  fsGroup: 65534

securityContext:
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - ALL
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Run as user ID
  runAsUser: 65534

service:
  # -- Service type
  type: ClusterIP
  # -- Service port for the HTTP server (validation/health endpoints)
  port: 8082
  # -- The address the metrics endpoint binds to. Use "0" to disable.
  metricsBindAddress: ":8081"

# -- Resource limits and requests
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# -- Deployment update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 25%
    maxSurge: 25%

# -- Number of old ReplicaSets to retain
revisionHistoryLimit: 1

# -- Termination grace period in seconds
terminationGracePeriodSeconds: 10

# -- Topology spread constraints for pod scheduling
topologySpreadConstraints: []

# -- Node selector for pod scheduling
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []

# -- Affinity rules for pod scheduling
affinity: {}

provider:
  # -- The name to register for the Provider custom resource.
  # Must match `name` in definition/provider.yaml and common.ProviderName.
  name: tidb
  # -- Short identifier for the provider, used in resource names
  # This appears in preset names (e.g., '<shortName>-replicaset') and can be
  # used in other contexts where a short concise provider identifier is needed.
  shortName: tidb

# TiDB Operator v2, bundled as a subchart (aliased "operator"). Values nested
# under this key are passed to the tidb-operator chart; see
# https://github.com/pingcap/tidb-operator/tree/master/charts/tidb-operator.
# Set operator.enabled=false to run against an externally managed operator or in
# integration tests that simulate operator behaviour.
operator:
  # -- Install the bundled TiDB Operator (its CRDs are applied by the operator at startup).
  enabled: true

# TiDB Operator CRDs. They are ~15 MB — too large to ship inside the Helm
# release (Helm stores the whole chart in the release Secret, which would exceed
# the API server's request-size limit). A pre-install/pre-upgrade hook Job
# applies the pinned CRD manifest from the network before the operator and
# provider start. Requires cluster egress to `url`.
crds:
  # -- Install the TiDB CRDs via a pre-install hook (needs egress to `url`).
  # Set to false for air-gapped clusters or to manage the CRDs yourself; then
  # apply them manually before install: kubectl apply --server-side -f <url>.
  install: true
  # -- Version-matched combined CRD manifest applied by the hook.
  url: https://github.com/pingcap/tidb-operator/releases/download/v2.0.1/tidb-operator.crds.yaml
  # -- Image providing `kubectl` for the install hook.
  image: registry.k8s.io/kubectl:v1.32.0
  # -- Job backoff limit for the install hook.
  backoffLimit: 3

# -- Default instance presets configuration
# Each preset must have 'name', 'enabled', and 'spec' fields.
# The 'spec' field contains the full InstancePresetSpec.
# Note: The provider shortName will be automatically added to each preset name.
presets: []
  # Example preset structure:
  # - name: standalone
  #   enabled: true
  #   spec:
  #     provider: tidb
  #     version: 1.0.0
  #     topology:
  #       type: standalone
  #     components:
  #       engine:
  #         replicas: 1
  #         resources:
  #           limits:
  #             cpu: "1"
  #             memory: 2Gi
  #         storage:
  #           size: 10Gi

# -- Additional environment variables to set on the provider container
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

# -- Additional volume mounts to add to the provider container
extraVolumeMounts: []

# -- Additional volumes to add to the pod
extraVolumes: []

# -- Leader election configuration
leaderElection:
  # -- Enable leader election (recommended for HA deployments)
  enabled: true

# TODO: Add values for your operator subchart dependency, e.g.:
# my-operator:
#   replicaCount: 1
#   rbac:
#     create: true
