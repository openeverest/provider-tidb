apiVersion: v2
name: provider-tidb
description: A Helm chart for deploying the OpenEverest provider-tidb provider
type: application
version: 0.1.1
appVersion: "0.1.1"
keywords:
  - openeverest
  - provider
  - database
home: https://github.com/openeverest/provider-tidb
sources:
  - https://github.com/openeverest/provider-tidb
maintainers:
  - name: OpenEverest Contributors
# The TiDB Operator v2 is bundled as a subchart so installing this chart brings
# up the operator (and its CRDs) alongside the provider. Disable it with
# operator.enabled=false to run against an externally managed operator.
dependencies:
  - name: tidb-operator
    alias: operator
    version: "v2.0.1"
    repository: oci://ghcr.io/pingcap/charts
    condition: operator.enabled
