# A new Instance seeded from the source's stream at POINT (filled in by the
# test). It enables point-in-time recovery itself, which must wait until the
# seeding restore is done.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: clone
spec:
  providerRef: {name: tidb}
  version: "8.5.2"
  topology:
    type: cluster
    parameters:
      tls:
        cluster: true
        client: true
  components:
    pd:
      type: pd
      replicas: 1
      storage: {size: 10Gi}
      parameters:
        config: |
          [replication]
          max-replicas = 1
    tikv: {type: tikv, replicas: 1, storage: {size: 20Gi}}
    tidb: {type: tidb, replicas: 1}
  backup:
    enabled: true
    classRef: {name: br}
    storages:
      - storageRef: {name: s3-store}
        pitr: {enabled: true}
  dataSource:
    type: PointInTime
    pointInTime:
      source:
        instanceRef: {name: test-instance}
        storageRef: {name: s3-store}
      recoveryTarget: date
      date: "POINT"
