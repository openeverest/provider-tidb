# The clone's cluster is created and, while seeding, the Instance reports the Restoring operation.
apiVersion: core.pingcap.com/v1alpha1
kind: Cluster
metadata:
  name: clone
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: clone
status:
  (conditions[?type == 'Restoring'].status | [0]): "True"
