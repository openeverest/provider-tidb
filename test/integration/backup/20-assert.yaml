# The provider must create a br.pingcap.com Backup (full snapshot) with inlined
# S3 storage and a BR-format credentials secret.
apiVersion: br.pingcap.com/v1alpha1
kind: Backup
metadata:
  name: test-backup
spec:
  backupType: full
  backupMode: snapshot
  br:
    cluster: bkp
    clusterNamespace: ($namespace)
  s3:
    provider: other
    bucket: test-bucket
    region: us-east-1
    endpoint: http://minio.storage:9000
    secretName: test-backup-br-s3
    # A folder per backup under the Instance's path in the storage.
    (starts_with(prefix, join('/', ['backups', $namespace, 'bkp', '']))): true
    (ends_with(prefix, '/s3-store/test-backup')): true
---
apiVersion: v1
kind: Secret
metadata:
  name: test-backup-br-s3
