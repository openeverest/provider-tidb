# The Cluster records the company issuer as its certificate source, and
# cert-manager issues every certificate from it under the Secret names the
# operator mounts, owned by the Cluster. The MySQL server certificate also
# covers the additional name.
apiVersion: core.pingcap.com/v1alpha1
kind: Cluster
metadata:
  name: cm-instance
  annotations:
    tidb.openeverest.io/tls-certificates: cert-manager:Issuer/company-ca
    tidb.openeverest.io/tls-additional-names: tidb.example.com
spec:
  tlsCluster:
    enabled: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cm-instance-pd-cluster-secret
  ownerReferences:
    - apiVersion: core.pingcap.com/v1alpha1
      kind: Cluster
      name: cm-instance
spec:
  secretName: cm-instance-pd-cluster-secret
  commonName: TiDB
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth
  issuerRef:
    name: company-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cm-instance-cluster-client-secret
spec:
  secretName: cm-instance-cluster-client-secret
  usages:
    - digital signature
    - key encipherment
    - client auth
  issuerRef:
    name: company-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cm-instance-tidb-server-secret
spec:
  secretName: cm-instance-tidb-server-secret
  commonName: cm-instance-tidb
  (contains(dnsNames, 'tidb.example.com')): true
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef:
    name: company-ca
---
# cert-manager issued it, with the company CA for clients to verify TiDB.
apiVersion: v1
kind: Secret
metadata:
  name: cm-instance-tidb-server-secret
type: kubernetes.io/tls
