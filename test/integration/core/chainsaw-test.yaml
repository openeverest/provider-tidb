---
# Core lifecycle suite: create an Instance, verify the provider produces the
# TiDB Operator v2 CRs, simulate the operator marking the groups ready, verify
# the Instance reports Ready, exercise the update paths (scale, CPU/memory,
# version bundle, TiFlash, storage), then delete.
#
# The TiDB operator itself is NOT deployed here — the provider is exercised in
# isolation and group readiness is simulated by patching group status.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: core
spec:
  description: |
    Lifecycle of an Instance: create, simulate operator readiness, update, and delete.

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instances.core.openeverest.io test-instance -o yaml
    - script:
        content: kubectl -n $NAMESPACE get cluster,pdgroup,tikvgroup,tidbgroup,tiflashgroup,podmonitor,vmpodscrape -o yaml
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-tidb
        tail: 100

  steps:
    - name: provider-deployed
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml
        - assert:
            file: 10-assert.yaml

    - name: instance-ready
      try:
        # No operator is running, so simulate it by marking each group converged:
        # desired replicas ready at the spec version. The group status schema
        # requires the full replica counters and a selector. The provider watches
        # the groups and recomputes the Instance status.
        - script:
            content: |
              set -e
              for g in pdgroup tikvgroup tidbgroup; do
                kubectl -n $NAMESPACE patch $g/test-instance --subresource status --type merge \
                  -p '{"status":{"version":"v7.5.5","replicas":1,"readyReplicas":1,"currentReplicas":1,"updatedReplicas":1,"selector":"app.kubernetes.io/instance=test-instance"}}'
              done
        - assert:
            file: 11-assert.yaml
        # The runtime writes the provider's connection details (including the
        # generated root password) into <instance>-conn.
        - script:
            content: |
              set -e
              pw=$(kubectl -n $NAMESPACE get secret test-instance-conn -o jsonpath='{.data.password}' | base64 -d)
              test -n "$pw" || { echo "connection secret has empty password"; exit 1; }
              echo "connection secret password length: ${#pw}"

    - name: rollout-reports-updating
      try:
        # Simulate the operator starting a rolling update of TiKV: a new revision
        # with no instance on it yet.
        - script:
            content: |
              kubectl -n $NAMESPACE patch tikvgroup/test-instance --subresource status --type merge \
                -p '{"status":{"updateRevision":"rev-2","currentRevision":"rev-1","updatedReplicas":0}}'
        - assert:
            file: 12-assert.yaml
        # Rollout finishes: every instance is on the new revision again.
        - script:
            content: |
              kubectl -n $NAMESPACE patch tikvgroup/test-instance --subresource status --type merge \
                -p '{"status":{"updateRevision":"rev-2","currentRevision":"rev-2","updatedReplicas":1}}'
        - assert:
            file: 11-assert.yaml

    - name: scale-tidb
      try:
        - patch:
            file: 17-scale-tidb.yaml
        - assert:
            file: 17-assert.yaml
        # The operator brings the second TiDB instance up.
        - script:
            content: |
              kubectl -n $NAMESPACE patch tidbgroup/test-instance --subresource status --type merge \
                -p '{"status":{"replicas":2,"readyReplicas":2,"currentReplicas":2,"updatedReplicas":2}}'
        - assert:
            file: 11-assert.yaml

    - name: resize-compute
      try:
        - patch:
            file: 18-resize-compute.yaml
        - assert:
            file: 18-assert.yaml
        # New resources change every group's pod template, so the operator starts
        # a new revision per group and rolls its instances onto it.
        - script:
            content: |
              set -e
              for g in pdgroup tikvgroup tidbgroup; do
                kubectl -n $NAMESPACE patch $g/test-instance --subresource status --type merge \
                  -p '{"status":{"updateRevision":"rev-resize","updatedReplicas":0}}'
              done
        - assert:
            file: 12-assert.yaml
        - script:
            content: |
              set -e
              for g in pdgroup tikvgroup tidbgroup; do
                r=$(kubectl -n $NAMESPACE get $g/test-instance -o jsonpath='{.spec.replicas}')
                kubectl -n $NAMESPACE patch $g/test-instance --subresource status --type merge \
                  -p "{\"status\":{\"currentRevision\":\"rev-resize\",\"updatedReplicas\":$r}}"
              done
        - assert:
            file: 11-assert.yaml

    - name: upgrade-version
      try:
        - patch:
            file: 19-upgrade-version.yaml
        - assert:
            file: 19-assert.yaml
        # The operator finishes upgrading every group to the new version.
        - script:
            content: |
              set -e
              for g in pdgroup tikvgroup tidbgroup; do
                kubectl -n $NAMESPACE patch $g/test-instance --subresource status --type merge \
                  -p '{"status":{"version":"v8.5.2"}}'
              done
        - assert:
            file: 11-assert.yaml

    - name: scale-out-tikv
      try:
        - patch:
            file: 20-scale-out-tikv.yaml
        - assert:
            file: 20-assert.yaml
        - script:
            content: |
              kubectl -n $NAMESPACE patch tikvgroup/test-instance --subresource status --type merge \
                -p '{"status":{"replicas":4,"readyReplicas":4,"currentReplicas":4,"updatedReplicas":4}}'
        - assert:
            file: 11-assert.yaml

    - name: scale-in-tikv
      try:
        - patch:
            file: 21-scale-in-tikv.yaml
        - assert:
            file: 21-assert.yaml
        # The operator takes the fourth store offline and removes it.
        - script:
            content: |
              kubectl -n $NAMESPACE patch tikvgroup/test-instance --subresource status --type merge \
                -p '{"status":{"replicas":3,"readyReplicas":3,"currentReplicas":3,"updatedReplicas":3}}'
        - assert:
            file: 11-assert.yaml

    - name: scale-in-tikv-below-max-replicas-rejected
      try:
        - patch:
            file: 22-scale-in-tikv-below-max-replicas.yaml
        - assert:
            file: 22-assert.yaml
        # Reverting the request brings the Instance straight back.
        - patch:
            file: 21-scale-in-tikv.yaml
        - assert:
            file: 11-assert.yaml

    - name: enable-monitoring
      try:
        - patch:
            file: 23-enable-monitoring.yaml
        - assert:
            file: 23-assert.yaml
        - assert:
            file: 11-assert.yaml

    - name: disable-monitoring
      try:
        - patch:
            file: 24-disable-monitoring.yaml
        - error:
            file: 24-error.yaml
        - assert:
            file: 11-assert.yaml

    - name: enable-tiflash
      try:
        - patch:
            file: 15-enable-tiflash.yaml
        - assert:
            file: 15-assert.yaml
        - script:
            content: |
              kubectl -n $NAMESPACE patch tiflashgroup/test-instance --subresource status --type merge \
                -p '{"status":{"version":"v8.5.2","replicas":1,"readyReplicas":1,"currentReplicas":1,"updatedReplicas":1,"selector":"app.kubernetes.io/instance=test-instance"}}'
        - assert:
            file: 11-assert.yaml

    - name: disable-tiflash
      try:
        - patch:
            file: 16-disable-tiflash.yaml
        - error:
            file: 16-error.yaml
        - assert:
            file: 11-assert.yaml

    - name: expand-storage
      try:
        - patch:
            file: 13-expand-storage.yaml
        - assert:
            file: 13-assert.yaml

    - name: shrink-storage-rejected
      try:
        - patch:
            file: 14-shrink-storage.yaml
        - assert:
            file: 14-assert.yaml
        # The group keeps the expanded size.
        - assert:
            file: 13-assert.yaml

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: test-instance
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-instance
            for:
              deletion: {}
