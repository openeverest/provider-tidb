# The provider scales the TiDBGroup and is not Ready, but stays Available, until the operator
# brings the new TiDB instance up.
apiVersion: core.pingcap.com/v1alpha1
kind: TiDBGroup
metadata:
  name: test-instance
spec:
  replicas: 2
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
status:
  (conditions[?type == 'Ready'].status | [0]): "False"
  (conditions[?type == 'Available'].status | [0]): "True"
