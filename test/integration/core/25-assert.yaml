# Validate rejects the change, so the Instance is not Ready (ValidationFailed)
# and the Cluster keeps TLS on.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
status:
  (conditions[?type == 'Ready']):
    - status: "False"
      reason: ValidationFailed
---
apiVersion: core.pingcap.com/v1alpha1
kind: Cluster
metadata:
  name: test-instance
spec:
  tlsCluster:
    enabled: true
