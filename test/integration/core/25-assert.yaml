# The change is checked against the live Cluster, so admission only warns and
# the reconciler blocks it: the Cluster keeps TLS on.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
status:
  (conditions[?type == 'Ready']):
    - status: "False"
      reason: InvalidReference
---
apiVersion: core.pingcap.com/v1alpha1
kind: Cluster
metadata:
  name: test-instance
spec:
  tlsCluster:
    enabled: true
