# The limits land on each group's template, which the operator applies as both
# requests and limits.
apiVersion: core.pingcap.com/v1alpha1
kind: PDGroup
metadata:
  name: test-instance
spec:
  template:
    spec:
      resources:
        cpu: 500m
        memory: 1Gi
---
apiVersion: core.pingcap.com/v1alpha1
kind: TiKVGroup
metadata:
  name: test-instance
spec:
  template:
    spec:
      resources:
        cpu: "1"
        memory: 4Gi
      # Below 8Gi the provider sizes TiKV's memory after the ~2.5Gi TiKV keeps
      # for its own runtime, and below 100Gi of disk it reserves 1GiB instead
      # of TiKV's 5GiB.
      config: |
        memory-usage-limit = "3712MiB"

        [rocksdb]
        write-buffer-limit = "230MiB"

        [storage]
        reserve-space = "1GiB"
        [storage.block-cache]
        capacity = "691MiB"
---
apiVersion: core.pingcap.com/v1alpha1
kind: TiDBGroup
metadata:
  name: test-instance
spec:
  template:
    spec:
      resources:
        cpu: 750m
        memory: 1536Mi
