# A Secret of the user's with the root password, and a second Instance that
# takes it. The quote and backslash must reach TiDB escaped in the bootstrap SQL.
apiVersion: v1
kind: Secret
metadata:
  name: my-root-password
stringData:
  password: 'p@ss''w\rd'
---
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: root-instance
spec:
  providerRef:
    name: tidb
  version: "8.5.8"
  userSecretRef:
    name: my-root-password
  topology:
    type: cluster
  components:
    pd:
      type: pd
      replicas: 1
      storage:
        size: 10Gi
    tikv:
      type: tikv
      replicas: 1
      storage:
        size: 20Gi
    tidb:
      type: tidb
      replicas: 1
