# Expected outcome of create-instance: the provider reconciles the Instance into
# a TiDB Operator v2 Cluster plus one group per component, all named after the
# Instance and referencing the shared Cluster. Chainsaw asserts are partial.
apiVersion: core.pingcap.com/v1alpha1
kind: Cluster
metadata:
  name: test-instance
  annotations:
    tidb.openeverest.io/tls-certificates: cert-manager
spec:
  bootstrapSQL:
    name: test-instance-tidb-bootstrap-sql
  tlsCluster:
    enabled: true
---
apiVersion: core.pingcap.com/v1alpha1
kind: PDGroup
metadata:
  name: test-instance
spec:
  cluster:
    name: test-instance
  replicas: 1
  template:
    spec:
      version: v7.5.8
      overlay:
        pod:
          metadata:
            labels:
              core.openeverest.io/component: pd
              core.openeverest.io/instance: test-instance
              core.openeverest.io/provider: tidb
      volumes:
        - name: data
          storage: 10Gi
---
apiVersion: core.pingcap.com/v1alpha1
kind: TiKVGroup
metadata:
  name: test-instance
spec:
  cluster:
    name: test-instance
  replicas: 1
  template:
    spec:
      version: v7.5.8
      overlay:
        pod:
          metadata:
            labels:
              core.openeverest.io/component: tikv
              core.openeverest.io/instance: test-instance
              core.openeverest.io/provider: tidb
      volumes:
        - name: data
          storage: 20Gi
---
apiVersion: core.pingcap.com/v1alpha1
kind: TiDBGroup
metadata:
  name: test-instance
spec:
  cluster:
    name: test-instance
  replicas: 1
  template:
    spec:
      version: v7.5.8
      security:
        tls:
          mysql:
            enabled: true
      overlay:
        pod:
          metadata:
            labels:
              core.openeverest.io/component: tidb
              core.openeverest.io/instance: test-instance
              core.openeverest.io/provider: tidb
---
# The provider generates a random root password and the bootstrap SQL that
# applies it on first cluster bootstrap.
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-tidb-root
type: Opaque
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-instance-tidb-bootstrap-sql
---
# cert-manager is installed, so preferTLS issues every certificate through it:
# one cert-manager Certificate per Secret the operator mounts, signed by a CA
# Certificate the provider creates for the Instance.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-instance-tls-ca
spec:
  secretName: test-instance-tls-ca
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-tls-ca
type: kubernetes.io/tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-instance-pd-cluster-secret
spec:
  secretName: test-instance-pd-cluster-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-pd-cluster-secret
type: kubernetes.io/tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-instance-tikv-cluster-secret
spec:
  secretName: test-instance-tikv-cluster-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-tikv-cluster-secret
type: kubernetes.io/tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-instance-tidb-cluster-secret
spec:
  secretName: test-instance-tidb-cluster-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-tidb-cluster-secret
type: kubernetes.io/tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-instance-tiflash-cluster-secret
spec:
  secretName: test-instance-tiflash-cluster-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-tiflash-cluster-secret
type: kubernetes.io/tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-instance-cluster-client-secret
spec:
  secretName: test-instance-cluster-client-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-cluster-client-secret
type: kubernetes.io/tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: test-instance-tidb-server-secret
spec:
  secretName: test-instance-tidb-server-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: test-instance-tidb-server-secret
type: kubernetes.io/tls
