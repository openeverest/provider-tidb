# Every component serves its metrics natively, so the provider publishes the
# endpoints of each ready component without any monitoring destination. With
# mTLS between components they are https and name the cluster client
# certificate the scraper presents, and the server name each component's
# certificate carries.
apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-instance
status:
  monitoring:
    sources:
      identity:
        labels:
          openeverest_instance: test-instance
          openeverest_namespace: ($namespace)
          openeverest_provider: tidb
      metrics:
        - component: pd
          kind: tidb.pd
          podSelector:
            core.openeverest.io/instance: test-instance
            core.openeverest.io/component: pd
          port: client
          path: /metrics
          scheme: https
          tls:
            ca:
              secretKeyRef: {name: test-instance-cluster-client-secret, key: ca.crt}
            serverName: test-instance-pd
            clientCertificateSecretRef: {name: test-instance-cluster-client-secret}
        - component: tikv
          kind: tikv
          podSelector:
            core.openeverest.io/instance: test-instance
            core.openeverest.io/component: tikv
          port: status
          path: /metrics
          scheme: https
          tls:
            ca:
              secretKeyRef: {name: test-instance-cluster-client-secret, key: ca.crt}
            serverName: test-instance-tikv
            clientCertificateSecretRef: {name: test-instance-cluster-client-secret}
        - component: tidb
          kind: tidb
          podSelector:
            core.openeverest.io/instance: test-instance
            core.openeverest.io/component: tidb
          port: status
          path: /metrics
          scheme: https
          tls:
            ca:
              secretKeyRef: {name: test-instance-cluster-client-secret, key: ca.crt}
            serverName: test-instance-tidb
            clientCertificateSecretRef: {name: test-instance-cluster-client-secret}
