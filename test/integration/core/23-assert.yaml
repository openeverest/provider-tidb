# The provider creates one PodMonitor, owned by the Instance and labelled so
# that plugin-metrics finds it and kube-prometheus-stack selects it. Each
# endpoint keeps only its component's pods.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: test-instance-metrics
  labels:
    app.kubernetes.io/managed-by: everest
    app.kubernetes.io/instance: test-instance
    core.openeverest.io/provider: tidb
    release: kube-prometheus-stack
  ownerReferences:
    - apiVersion: core.openeverest.io/v1alpha1
      kind: Instance
      name: test-instance
spec:
  selector:
    matchLabels:
      core.openeverest.io/instance: test-instance
      core.openeverest.io/provider: tidb
  podTargetLabels:
    - core.openeverest.io/component
  podMetricsEndpoints:
    - port: client
      path: /metrics
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_core_openeverest_io_component]
          regex: pd
    - port: status
      path: /metrics
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_core_openeverest_io_component]
          regex: tikv|tidb
    - port: metrics
      path: /metrics
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_core_openeverest_io_component]
          regex: tiflash
    - port: proxy-metrics
      path: /metrics
      interval: 30s
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_core_openeverest_io_component]
          regex: tiflash
