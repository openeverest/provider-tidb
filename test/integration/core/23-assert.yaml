  name: test-instance-vm-metrics
  labels:
    app.kubernetes.io/managed-by: everest
    app.kubernetes.io/instance: test-instance
    core.openeverest.io/provider: tidb
    team: db
  ownerReferences:
    - apiVersion: core.openeverest.io/v1alpha1
      kind: Instance
      name: test-instance
spec:
  selector:
    matchLabels:
      core.openeverest.io/instance: test-instance
      core.openeverest.io/provider: tidb
  podTargetLabels:
    - core.openeverest.io/component
  podMetricsEndpoints:
    - port: client
      path: /metrics
      interval: 1m
      scheme: https
      tlsConfig:
        ca:
          secret: {name: test-instance-cluster-client-secret, key: ca.crt}
