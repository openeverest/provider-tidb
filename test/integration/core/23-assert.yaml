# The provider creates a PodMonitor and a VMPodScrape, owned by the Instance and labelled so
# that plugin-metrics finds them and the monitoring systems select them. Each
# endpoint keeps only its component's pods and, with mTLS between components,
# scrapes over https with the cluster client certificate.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: test-instance-metrics
  labels:
    app.kubernetes.io/managed-by: everest
    app.kubernetes.io/instance: test-instance
    core.openeverest.io/provider: tidb
    release: kube-prometheus-stack
  ownerReferences:
    - apiVersion: core.openeverest.io/v1alpha1
      kind: Instance
      name: test-instance
spec:
  selector:
    matchLabels:
      core.openeverest.io/instance: test-instance
      core.openeverest.io/provider: tidb
  podTargetLabels:
    - core.openeverest.io/component
  podMetricsEndpoints:
    - port: client
      path: /metrics
      interval: 30s
      scheme: https
      tlsConfig:
        ca:
          secret: {name: test-instance-cluster-client-secret, key: ca.crt}
        cert:
          secret: {name: test-instance-cluster-client-secret, key: tls.crt}
        keySecret: {name: test-instance-cluster-client-secret, key: tls.key}
        serverName: test-instance-pd
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_core_openeverest_io_component]
          regex: pd
    - port: status
      path: /metrics
      interval: 30s
      scheme: https
      tlsConfig:
        ca:
          secret: {name: test-instance-cluster-client-secret, key: ca.crt}
        cert:
          secret: {name: test-instance-cluster-client-secret, key: tls.crt}
        keySecret: {name: test-instance-cluster-client-secret, key: tls.key}
        serverName: test-instance-tikv
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_core_openeverest_io_component]
          regex: tikv
    - port: status
      path: /metrics
      interval: 30s
      scheme: https
      tlsConfig:
        ca:
          secret: {name: test-instance-cluster-client-secret, key: ca.crt}
        cert:
          secret: {name: test-instance-cluster-client-secret, key: tls.crt}
        keySecret: {name: test-instance-cluster-client-secret, key: tls.key}
        serverName: test-instance-tidb
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_core_openeverest_io_component]
          regex: tidb
    - port: metrics
      path: /metrics
      interval: 30s
      scheme: https
      tlsConfig:
        ca:
          secret: {name: test-instance-cluster-client-secret, key: ca.crt}
        cert:
          secret: {name: test-instance-cluster-client-secret, key: tls.crt}
        keySecret: {name: test-instance-cluster-client-secret, key: tls.key}
        serverName: test-instance-tiflash
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_core_openeverest_io_component]
          regex: tiflash
    - port: proxy-metrics
      path: /metrics
      interval: 30s
      scheme: https
      tlsConfig:
        ca:
          secret: {name: test-instance-cluster-client-secret, key: ca.crt}
        cert:
          secret: {name: test-instance-cluster-client-secret, key: tls.crt}
        keySecret: {name: test-instance-cluster-client-secret, key: tls.key}
        serverName: test-instance-tiflash
      relabelings:
        - action: keep
          sourceLabels: [__meta_kubernetes_pod_label_core_openeverest_io_component]
          regex: tiflash
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
