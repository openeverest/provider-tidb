---
# End-to-end suite: the real TiDB Operator v2 provisions an actual TiDB cluster
# from an Instance. Requires the provider deployed WITH the bundled operator and
# its CRDs (see the deploy-provider-e2e Make target).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: e2e
spec:
  description: |
    Create an Instance, wait for the operator to bring up PD/TiKV/TiDB pods,
    run SELECT 1 with the connection-secret credentials, scale TiKV out and
    back in without losing data, back the data up to an in-cluster S3 and
    restore it, then delete.

  # Image pulls and first cluster bootstrap take minutes, not seconds.
  timeouts:
    assert: 10m
    error: 5m
    delete: 5m
    cleanup: 5m

  catch:
    - script:
        content: kubectl -n $NAMESPACE get instances.core.openeverest.io test-instance -o yaml
    - script:
        content: kubectl -n $NAMESPACE get cluster,pdgroup,tikvgroup,tidbgroup,pd,tikv,tidb -o yaml
    - script:
        content: kubectl -n $NAMESPACE get backups.backup.openeverest.io,restores.backup.openeverest.io,backups.br.pingcap.com,restores.br.pingcap.com,jobs -o yaml
    - script:
        content: kubectl -n $NAMESPACE get pods,pvc,events -o wide
    - script:
        content: kubectl -n $NAMESPACE describe pods -l pingcap.com/cluster=test-instance
    # --previous captures the crashed container, which is where a crash-loop's cause lives.
    - script:
        content: |
          for p in $(kubectl -n $NAMESPACE get pods -l pingcap.com/cluster=test-instance -o name); do
            echo "===== $p (previous)"; kubectl -n $NAMESPACE logs $p --previous --tail=200 || true
            echo "===== $p (current)"; kubectl -n $NAMESPACE logs $p --tail=100 || true
          done
    - script:
        content: kubectl describe nodes | grep -A 12 -E "^(Name|Allocated resources|Conditions):"
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/name=provider-tidb
        tail: 100
    - podLogs:
        namespace: provider-system
        selector: app.kubernetes.io/component=tidb-operator
        tail: 100
    - podLogs:
        selector: app.kubernetes.io/name=sql-client
        tail: 50

  steps:
    - name: operator-and-provider-deployed
      try:
        - assert:
            file: 00-assert.yaml

    - name: create-instance
      try:
        - apply:
            file: 10-create-instance.yaml

    - name: cluster-ready
      try:
        - assert:
            file: 20-assert.yaml
        - assert:
            file: ../core/11-assert.yaml

    - name: sql-connect
      try:
        - apply:
            file: 30-sql-client.yaml
        - assert:
            timeout: 3m
            file: 30-assert.yaml

    - name: tikv-scale-out
      try:
        - apply:
            file: 50-sql-shell.yaml
        - assert:
            file: 50-assert.yaml
        - patch:
            file: 51-scale-out-tikv.yaml
        - assert:
            file: 51-assert.yaml
        - assert:
            file: ../core/11-assert.yaml
        # Split a table into regions and wait until they sit on both TiKV nodes,
        # so whichever node the scale-in removes holds some of its data.
        - script:
            timeout: 6m
            content: |
              set -e
              sql() { echo "$1" | kubectl -n $NAMESPACE exec -i sql-shell -- sh -c 'mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -N -s'; }
              sql "CREATE DATABASE e2e; CREATE TABLE e2e.rows (id INT PRIMARY KEY, v VARCHAR(64));"
              sql "INSERT INTO e2e.rows WITH RECURSIVE s(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM s WHERE n < 1000) SELECT n, MD5(n) FROM s;"
              sql "SPLIT TABLE e2e.rows BY (125), (250), (375), (500), (625), (750), (875);" >/dev/null
              for i in $(seq 1 70); do
                stores=$(sql "SELECT COUNT(DISTINCT p.STORE_ID) FROM information_schema.TIKV_REGION_PEERS p JOIN information_schema.TIKV_REGION_STATUS s ON p.REGION_ID = s.REGION_ID WHERE s.DB_NAME = 'e2e';")
                echo "e2e.rows regions span $stores TiKV node(s)"
                [ "$stores" = "2" ] && exit 0
                sleep 5
              done
              exit 1

    - name: tikv-scale-in
      try:
        # With one copy per region the leaders have nowhere to go, so the
        # operator waits out its fixed 5-minute leader-eviction timeout before
        # PD moves the regions and the store is removed.
        - patch:
            file: 60-scale-in-tikv.yaml
        - assert:
            file: 60-assert.yaml
        - assert:
            file: ../core/11-assert.yaml
        # No row was lost, the table is consistent and PD has one store left.
        - script:
            content: |
              set -e
              sql() { echo "$1" | kubectl -n $NAMESPACE exec -i sql-shell -- sh -c 'mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -N -s'; }
              rows=$(sql "SELECT COUNT(*), SUM(id) FROM e2e.rows;")
              echo "rows: $rows"
              [ "$rows" = "$(printf '1000\t500500')" ]
              sql "ADMIN CHECK TABLE e2e.rows;"
              up=$(sql "SELECT COUNT(*) FROM information_schema.TIKV_STORE_STATUS WHERE STORE_STATE_NAME = 'Up';")
              echo "up stores: $up"
              [ "$up" = "1" ]

    - name: backup
      try:
        - apply:
            file: 70-s3.yaml
        - assert:
            file: 70-assert.yaml
        - apply:
            file: 71-bucket.yaml
        - assert:
            file: 71-assert.yaml
        - apply:
            file: 72-backup-storage.yaml
        - patch:
            file: 72-enable-backup.yaml
        - apply:
            file: 73-backup.yaml
        - assert:
            file: 73-assert.yaml

    - name: restore
      try:
        # Lose the table, then bring it back from the backup.
        - script:
            content: |
              set -e
              echo "DROP DATABASE e2e;" | kubectl -n $NAMESPACE exec -i sql-shell -- sh -c 'mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER"'
        - apply:
            file: 74-restore.yaml
        - assert:
            file: 74-assert.yaml
        - script:
            content: |
              set -e
              sql() { echo "$1" | kubectl -n $NAMESPACE exec -i sql-shell -- sh -c 'mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -N -s'; }
              rows=$(sql "SELECT COUNT(*), SUM(id) FROM e2e.rows;")
              echo "rows after restore: $rows"
              [ "$rows" = "$(printf '1000\t500500')" ]
              sql "ADMIN CHECK TABLE e2e.rows;"

    - name: delete-instance
      try:
        - delete:
            ref:
              apiVersion: core.openeverest.io/v1alpha1
              kind: Instance
              name: test-instance
        - wait:
            apiVersion: core.openeverest.io/v1alpha1
            kind: Instance
            name: test-instance
            for:
              deletion: {}
        - error:
            file: 40-error.yaml
