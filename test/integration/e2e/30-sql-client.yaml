# One-shot MySQL client that authenticates with the credentials the provider
# published in <instance>-conn, verifies TiDB's certificate and host name
# against the CA published there too, requires `SELECT 1` to return 1 and the
# session to be encrypted.
apiVersion: v1
kind: Pod
metadata:
  name: sql-client
  labels:
    app.kubernetes.io/name: sql-client
spec:
  restartPolicy: Never
  containers:
    - name: mysql
      image: mysql:8.4
      command:
        - sh
        - -c
        - |
          set -e
          q() { mysql -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=VERIFY_IDENTITY --ssl-ca=/tls/ca.crt -N -s -e "$1"; }
          test "$(q 'SELECT 1')" = "1"
          q "SHOW SESSION STATUS LIKE 'Ssl_version'" | grep TLS
      env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: test-instance-conn
              key: host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: test-instance-conn
              key: port
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: test-instance-conn
              key: username
        # Read by the mysql client, keeping the password off the command line.
        - name: MYSQL_PWD
          valueFrom:
            secretKeyRef:
              name: test-instance-conn
              key: password
      volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
  volumes:
    - name: tls
      secret:
        secretName: test-instance-conn
        items:
          - key: ca.crt
            path: ca.crt
